<!DOCTYPE html>

<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boggle in Japanese</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Boggle</h1>

    <h2 class="selected">Selected: <span id="selected"></span></h2>

    <div id="grid" class="boggle-grid"></div>
  </div>

</body>

<script>
  /**
    Hiragana ordered by letter frequency
    total: 83 letters
    https://ja.wikipedia.org/wiki/%E6%96%87%E5%AD%97%E3%81%AE%E5%87%BA%E7%8F%BE%E9%A0%BB%E5%BA%A6#%E6%97%A5%E6%9C%AC%E8%AA%9E%E3%81%AB%E3%81%8A%E3%81%91%E3%82%8B%E6%96%87%E5%AD%97%E3%81%AE%E5%87%BA%E7%8F%BE%E9%A0%BB%E5%BA%A6
  */
  const letters = ["の", "に", "た", "い", "は", "を", "と", "る", "が", "し", "で", "て", "な", "か", "っ", "れ", "ら", "も", "う", "す", "り", "こ", "だ", "ま", "さ", "き", "め", "く", "あ", "け", "ど", "ん", "え", "よ", "つ", "や", "そ", "わ", "ち", "み", "せ", "ろ", "ば", "お", "じ", "べ", "ず", "げ", "ほ", "へ", "び", "む", "ご", "ね", "ぶ", "ぐ", "ぎ", "ひ", "ょ", "づ", "ぼ", "ざ", "ふ", "ゃ", "ぞ", "ゆ", "ぜ", "ぬ", "ぱ", "ゅ", "ぴ", "ぽ", "ぷ", "ぺ", "ぁ", "ぇ", "ぢ", "ゑ", "ゐ", "ぉ", "ぃ", "ゎ", "ぅ"]

  const dices = Array.from({length: 16}, (_, i) => {
    const grid = []
    for (i = 0; i <= 5; i++) {
      // get a letter randomly
      const letter = letters[Math.floor(Math.random() * letters.length)]
      grid.push(letter)
    }
    return grid
  })

  const selected = document.getElementById("selected");
  const gridContainer = document.getElementById("grid")

  function updateSelectedText(el) {
    const currentText = selected.innerText;
    selected.innerText = `${currentText}${el.target.value}`
  }

  const list = Array(16)
  for (let i = 0; i < list.length; i++) {
    const input = document.createElement("input")
    input.type = "button"
    input.name = `grid-${i}`
    const dice = dices[i]
    input.value = dice[Math.floor(Math.random() * dice.length)]

    input.addEventListener("click", (el) => updateSelectedText(el))

    gridContainer.appendChild(input)
  }
</script>

</html>
